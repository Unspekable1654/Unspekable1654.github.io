name: Report a problem
description: Something in EasySign isn't working
title: "Problem: "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry something went wrong. What you write here can be seen by others, so please don't include personal details, signatures or documents.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again (if you know them)
      placeholder: |
        1. Open a PDF
        2. Click Signature
        3. ...
  - type: input
    id: version
    attributes:
      label: EasySign version
      description: Shown in About, the (i) button at the top right.
      placeholder: "1.3.0"
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Not sure
