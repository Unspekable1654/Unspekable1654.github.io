name: Feedback
description: Tell me what you think of EasySign
title: "Feedback: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking a minute to share your thoughts. What you write here can be seen by others, so please don't include personal details or documents.
  - type: dropdown
    id: rating
    attributes:
      label: How would you rate EasySign?
      options:
        - "5: Love it"
        - "4: Good"
        - "3: OK"
        - "2: Not great"
        - "1: Didn't work for me"
    validations:
      required: true
  - type: textarea
    id: good
    attributes:
      label: What works well?
  - type: textarea
    id: better
    attributes:
      label: What could be better, or what is missing?
  - type: input
    id: version
    attributes:
      label: EasySign version (optional)
      description: Shown in About, the (i) button at the top right.
      placeholder: "1.3.0"
