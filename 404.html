<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found: EasySign</title>
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/images/logo.png">
<style>
  :root { --bg: #F5F4EE; --text: #1F1E1D; --muted: #5B5A55; --button: #AE5433; --button-hover: #9C4A2B; --on-accent: #FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1C1B19; --text: #EEEBE3; --muted: #B6B2A8; --button: #D97757; --button-hover: #E08A6C; --on-accent: #1F1E1D; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.6 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; text-align: center; padding: 24px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: normal; font-size: 2.2rem; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: inline-block; padding: 12px 22px; border-radius: 10px; background: var(--button); color: var(--on-accent);
          font-weight: 600; text-decoration: none; }
  a.btn:hover { background: var(--button-hover); }
  img { width: 56px; height: 56px; }
</style>
</head>
<body>
  <main>
    <img src="/images/logo.png" alt="">
    <h1>Page not found</h1>
    <p>This page doesn't exist. The EasySign home page has everything.</p>
    <a class="btn" href="/">Go to EasySign</a>
  </main>
</body>
</html>
